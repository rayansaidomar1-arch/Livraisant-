<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livraisanté — Administration</title>
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0D0E09;--lime:#C2F23E;--lime-d:#6E9A0A;
  --white:#fff;--grey:#F2F2F0;--mid:#888880;
  --ok:#16A34A;--err:#DC2626;--warn:#D97706;
  --pharma:#7C3AED;--sport:#1F6FEB;
  --serif:'Bricolage Grotesque',sans-serif;
  --sans:'Hanken Grotesk',sans-serif;
  --sidebar:240px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--grey);color:var(--ink);min-height:100vh}
a{text-decoration:none;color:inherit}
input,select,button{font-family:var(--sans)}

/* ── LOGIN ── */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--ink)}
.login-box{background:var(--white);border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.login-logo{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.login-logo svg{border-radius:12px;flex:0 0 auto}
.login-logo div{font-family:var(--serif);font-weight:800;font-size:22px;letter-spacing:-.03em}
.login-logo small{display:block;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);font-family:var(--sans)}
.l-label{font-size:12px;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:6px}
.l-input{width:100%;padding:12px 14px;border:2px solid #e5e5e5;border-radius:10px;font-size:15px;transition:.12s;margin-bottom:14px}
.l-input:focus{outline:none;border-color:var(--ink)}
.l-btn{width:100%;padding:14px;background:var(--ink);color:var(--white);border:none;border-radius:12px;font-family:var(--serif);font-weight:800;font-size:16px;cursor:pointer;box-shadow:3px 3px 0 var(--lime)}
.l-err{background:#fcebe9;border:1.5px solid var(--err);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--err);font-weight:600;margin-bottom:12px;display:none}
.l-note{font-size:12px;color:var(--mid);text-align:center;margin-top:16px}

/* ── ADMIN LAYOUT ── */
#adminApp{display:none;min-height:100vh;flex-direction:row}
.sidebar{width:var(--sidebar);background:var(--ink);color:var(--white);padding:24px 0;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto}
.sb-brand{padding:0 20px 24px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-brand h2{font-family:var(--serif);font-weight:800;font-size:18px;color:var(--white);letter-spacing:-.03em}
.sb-brand span{display:block;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--lime);margin-top:4px}
.sb-nav{padding:16px 0;flex:1}
.sb-section{font-size:9px;font-weight:800;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.35);padding:12px 20px 6px}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.7);cursor:pointer;transition:.12s;border-left:3px solid transparent}
.sb-item:hover,.sb-item.on{background:rgba(255,255,255,.07);color:var(--white);border-left-color:var(--lime)}
.sb-item .ic{font-size:16px;flex:0 0 auto}
.sb-foot{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1)}
.logout-btn{width:100%;padding:10px;background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.3);border-radius:8px;color:#fca5a5;font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer}
.main{margin-left:var(--sidebar);padding:32px;flex:1}
.page-title{font-family:var(--serif);font-weight:800;font-size:28px;letter-spacing:-.04em;margin-bottom:24px;display:flex;align-items:center;gap:10px}

/* ── CARDS & GRIDS ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.kpi{background:var(--white);border:2px solid var(--ink);border-radius:16px;padding:20px;box-shadow:3px 3px 0 var(--lime)}
.kpi .k-label{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--mid);margin-bottom:8px}
.kpi .k-value{font-family:var(--serif);font-weight:800;font-size:36px;letter-spacing:-.04em;color:var(--ink);line-height:1}
.kpi .k-sub{font-size:12px;color:var(--mid);margin-top:4px}
.kpi.highlight{background:var(--ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--lime)}
.kpi.highlight .k-value{color:var(--lime)}
.kpi.highlight .k-label,.kpi.highlight .k-sub{color:rgba(255,255,255,.5)}

.card{background:var(--white);border:2px solid var(--ink);border-radius:16px;padding:24px;margin-bottom:20px}
.card h3{font-family:var(--serif);font-weight:800;font-size:18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{text-align:left;font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);padding:8px 12px;border-bottom:2px solid var(--ink)}
.table td{padding:10px 12px;border-bottom:1px solid #eee;vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.b-lime{background:var(--lime);color:var(--ink)}
.b-dark{background:var(--ink);color:var(--lime)}
.b-ok{background:#d7f0db;color:var(--ok)}
.b-err{background:#fcebe9;color:var(--err)}
.b-warn{background:#fffbe6;color:var(--warn)}
.b-pharma{background:#ede9fe;color:var(--pharma)}

/* Charts (bars) */
.bar-chart{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:120px 1fr 50px;align-items:center;gap:10px;font-size:13px}
.bar-track{height:12px;background:var(--grey);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;transition:width .6s ease}
.bar-val{font-weight:700;text-align:right;font-size:12px}

/* Promo codes */
.promo-form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f-group{display:flex;flex-direction:column;gap:6px}
.f-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--mid)}
.f-input,.f-select{padding:10px 14px;border:2px solid #e5e5e5;border-radius:10px;font-size:14px;width:100%;transition:.12s}
.f-input:focus,.f-select:focus{outline:none;border-color:var(--ink)}
.gen-btn{background:var(--ink);color:var(--lime);border:2px solid var(--ink);border-radius:12px;padding:12px 24px;font-family:var(--serif);font-weight:800;font-size:15px;cursor:pointer;box-shadow:3px 3px 0 var(--lime);transition:.12s}
.gen-btn:hover{transform:translateY(-2px);box-shadow:5px 5px 0 var(--lime)}
.code-tag{font-family:monospace;font-weight:800;font-size:18px;letter-spacing:4px;background:var(--lime);padding:6px 14px;border-radius:8px;color:var(--ink);border:1.5px solid var(--lime-d)}
.copy-btn{font-size:12px;font-weight:700;padding:5px 10px;border:1.5px solid var(--ink);border-radius:6px;background:transparent;cursor:pointer;font-family:var(--sans)}
.copy-btn:hover{background:var(--ink);color:var(--white)}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);margin-bottom:24px}
.tab{padding:10px 20px;font-weight:700;font-size:13.5px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.12s}
.tab.on{border-bottom-color:var(--lime);color:var(--ink)}
.tab:not(.on){color:var(--mid)}

/* Notification association */
.assoc-month{display:flex;align-items:center;gap:16px;background:var(--grey);border-radius:12px;padding:16px}
.assoc-month .icon{font-size:32px}

@media(max-width:900px){
  .sidebar{width:60px;padding:16px 0}
  .sb-brand,.sb-section,.sb-item span,.sb-foot{display:none}
  .sb-item{justify-content:center;padding:12px}
  .main{margin-left:60px;padding:20px}
  .grid2,.promo-form,.kpi-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ════════ LOGIN ════════ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 100 100" width="48" height="48" style="background:#0D0E09;border-radius:12px">
        <rect x="38" y="6" width="24" height="88" rx="12" fill="white"/>
        <rect x="6" y="38" width="32" height="24" rx="12" fill="white"/>
        <rect x="38" y="38" width="28" height="24" fill="white"/>
        <path d="M62,38 L80,38 L96,50 L80,62 L62,62 Z" fill="#C2F23E"/>
        <rect x="38" y="38" width="28" height="24" fill="white"/>
      </svg>
      <div>Livraisanté<small>Administration</small></div>
    </div>
    <div id="loginErr" class="l-err">Email ou mot de passe incorrect.</div>
    <label class="l-label">Email administrateur</label>
    <input type="email" id="loginEmail" class="l-input" placeholder="admin@livraisante.fr">
    <label class="l-label">Mot de passe</label>
    <input type="password" id="loginPassword" class="l-input" placeholder="••••••••" onkeypress="if(event.key==='Enter')doAdminLogin()">
    <button id="loginBtn" class="l-btn" onclick="doAdminLogin()">Accéder au tableau de bord →</button>
    <p class="l-note">Accès réservé — Livraisanté SAS</p>
  </div>
</div>

<!-- ════════ ADMIN APP ════════ -->
<div id="adminApp">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sb-brand">
      <h2>Livraisan<span style="color:var(--lime)">té</span></h2>
      <span>Administration</span>
    </div>
    <nav class="sb-nav">
      <div class="sb-section">Principal</div>
      <div class="sb-item on" onclick="showPage('dashboard')"><span class="ic">📊</span><span>Dashboard</span></div>
      <div class="sb-item" onclick="showPage('users')"><span class="ic">👥</span><span>Utilisateurs</span></div>
      <div class="sb-item" onclick="showPage('pharmacies')"><span class="ic">💊</span><span>Pharmacies</span></div>
      <div class="sb-item" onclick="showPage('orders')"><span class="ic">📦</span><span>Commandes</span></div>
      <div class="sb-section">Marketing</div>
      <div class="sb-item" onclick="showPage('promo')"><span class="ic">🎁</span><span>Codes promo</span></div>
      <div class="sb-item" onclick="showPage('association')"><span class="ic">🎗️</span><span>Association</span></div>
      <div class="sb-section">Système</div>
      <div class="sb-item" onclick="showPage('system')"><span class="ic">⚙️</span><span>Système</span></div>
    </nav>
    <div class="sb-foot">
      <button class="logout-btn" onclick="doAdminLogout()">⏻ Déconnexion</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" id="mainContent"></main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"
  integrity="sha384-2zrRDgDHSYB/GN3nFW3fsZXoxEhKIr3N2h63Tc6DEOB9JJdFIu8xMJT2Cph/gBil"
  crossorigin="anonymous"></script>
<script>
// ════════════════════════════════════════════════════════════
// AUTH — Supabase uniquement (aucun credential en dur)
// ════════════════════════════════════════════════════════════
const _SB_URL  = 'https://gsmrgafclxkuqzzhtapi.supabase.co';
const _SB_ANON = 'sb_publishable_lkkWiVC0Zs59wv7WBqGiuQ_XKIarkBc';
const _sbAdmin = supabase.createClient(_SB_URL, _SB_ANON);
let adminUser=null;

async function doAdminLogin(){
  const email=document.getElementById('loginEmail').value.trim().toLowerCase();
  const pwd=document.getElementById('loginPassword').value;
  const errEl=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  if(!email||!pwd){errEl.textContent='Remplissez tous les champs.';errEl.style.display='block';return;}
  btn.disabled=true; btn.textContent='Connexion…';
  try{
    // 1. Authentification Supabase
    const {data,error}=await _sbAdmin.auth.signInWithPassword({email,password:pwd});
    if(error){errEl.textContent='Identifiants incorrects.';errEl.style.display='block';btn.disabled=false;btn.textContent='Se connecter →';return;}
    // 2. Vérification du rôle admin côté serveur (table profiles, protégée par RLS)
    const {data:profile,error:pErr}=await _sbAdmin.from('profiles').select('role,prenom,nom').eq('id',data.user.id).single();
    if(pErr||profile?.role!=='admin'){
      await _sbAdmin.auth.signOut();
      errEl.textContent='Accès refusé — compte non autorisé.';errEl.style.display='block';
      btn.disabled=false;btn.textContent='Se connecter →';return;
    }
    adminUser={id:data.user.id,email:data.user.email,name:(profile.prenom||'')+' '+(profile.nom||'')};
    document.getElementById('loginScreen').style.display='none';
    const app=document.getElementById('adminApp');app.style.display='flex';
    await showPage('dashboard');
  }catch(e){
    errEl.textContent='Erreur réseau. Réessayez.';errEl.style.display='block';
  }
  btn.disabled=false;btn.textContent='Se connecter →';
}

async function doAdminLogout(){
  await _sbAdmin.auth.signOut();
  adminUser=null;
  document.getElementById('adminApp').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginEmail').value='';
  document.getElementById('loginPassword').value='';
}

// ════════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════════
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ════════════════════════════════════════════════════════════
// DATA — branchement réel Supabase (2026-07-22, complété 2026-07-22). `profiles`,
// `pharmacies`, `drivers`, `orders` sont lus directement en base (RLS admin :
// migration 20260721000002_pharmacy_settings_and_admin_rls). Les codes promo
// utilisent désormais la table serveur unique `promo_codes` (migration
// 20260722000000_blocking_and_important_fixes.sql), partagée avec l'admin
// intégré de index.html — les deux interfaces lisent/écrivent la même donnée.
// `stats` (consultations/ailments/abandons) restent partiellement en
// localStorage le temps du branchement `app_events` (voir pageDashboard()).
// ════════════════════════════════════════════════════════════
let ADMIN_DATA={profiles:[],pharmacies:[],drivers:[],orders:[],promoCodes:[],pharmacyApplications:[],loaded:false};
async function loadAdminData(force){
  if(ADMIN_DATA.loaded&&!force) return ADMIN_DATA;
  const [{data:profiles,error:e1},{data:pharmacies,error:e2},{data:drivers,error:e3},{data:orders,error:e4}]=await Promise.all([
    _sbAdmin.from('profiles').select('*'),
    _sbAdmin.from('pharmacies').select('*'),
    _sbAdmin.from('drivers').select('*'),
    _sbAdmin.from('orders').select('*').order('created_at',{ascending:false}).limit(2000),
  ]);
  if(e1||e2||e3||e4) console.error('Erreur chargement données admin :',e1||e2||e3||e4);
  ADMIN_DATA={...ADMIN_DATA,profiles:profiles||[],pharmacies:pharmacies||[],drivers:drivers||[],orders:orders||[],loaded:true};
  return ADMIN_DATA;
}
function getStats(){try{return JSON.parse(localStorage.getItem('livraisante_stats_v2')||'{}');}catch(e){return {};}}
// Agrégat serveur des consultations/abandons (table app_events, migration
// 20260722000000) — remplace l'ancienne mesure 100% localStorage : ces
// événements sont désormais centralisés tous utilisateurs confondus.
async function loadAppEventsAdmin(){
  const {data,error}=await _sbAdmin.from('app_events').select('kind,payload').order('created_at',{ascending:false}).limit(5000);
  if(error){ console.error('Erreur chargement app_events :',error); return {consultations:0,abandoned:0,byAilment:{},abandonReasons:{}}; }
  const byAilment={}, abandonReasons={};
  let consultations=0, abandoned=0;
  (data||[]).forEach(ev=>{
    if(ev.kind==='consultation'){
      consultations++;
      (ev.payload?.ailments||[]).forEach(id=>{ byAilment[id]=byAilment[id]||{c:0}; byAilment[id].c++; });
    }else if(ev.kind==='abandon'){
      abandoned++;
      const r=ev.payload?.reason;
      if(r) abandonReasons[r]=(abandonReasons[r]||0)+1;
    }
  });
  return {consultations,abandoned,byAilment,abandonReasons};
}
async function loadPromoCodesAdmin(){
  const {data,error}=await _sbAdmin.from('promo_codes').select('*').order('created_at',{ascending:false});
  if(error){ console.error('Erreur chargement promo_codes :',error); return []; }
  ADMIN_DATA.promoCodes=data||[];
  return ADMIN_DATA.promoCodes;
}
// Candidatures « devenir pharmacie partenaire » (table pharmacy_applications,
// remplie par index.html #pharmacySignup). Avant le 2026-07-22 aucune interface
// admin n'affichait ces dossiers ni ne pouvait changer leur statut (policy
// UPDATE manquante) — un admin ne pouvait donc jamais « valider » un compte
// pharmacien candidat malgré le message promis au candidat.
async function loadPharmacyApplicationsAdmin(){
  const {data,error}=await _sbAdmin.from('pharmacy_applications').select('*').eq('status','en_attente').order('created_at',{ascending:false}).limit(100);
  if(error){ console.error('Erreur chargement pharmacy_applications :',error); ADMIN_DATA.pharmacyApplications=[]; return []; }
  ADMIN_DATA.pharmacyApplications=data||[];
  return ADMIN_DATA.pharmacyApplications;
}
async function resolvePharmacyApplicationAdmin(id,status){
  const {error}=await _sbAdmin.from('pharmacy_applications').update({status}).eq('id',id);
  if(error){ alert('Erreur : '+error.message); return; }
  await loadPharmacyApplicationsAdmin();
  showPage('pharmacies');
}
async function createPromoCodeAdmin(row){
  const {data,error}=await _sbAdmin.from('promo_codes').insert(row).select().single();
  if(error) return {error};
  return {data};
}
async function togglePromoCodeAdmin(code,active){
  const {error}=await _sbAdmin.from('promo_codes').update({active}).eq('code',code);
  return {error};
}
async function deletePromoCodeAdmin(code){
  const {error}=await _sbAdmin.from('promo_codes').delete().eq('code',code);
  return {error};
}

function computeKPIs(){
  const profiles=ADMIN_DATA.profiles||[];
  const pharmacies=ADMIN_DATA.pharmacies||[];
  const drivers=profiles.filter(p=>p.role==='livreur');
  const patients=profiles.filter(p=>p.role==='patient'||p.role==='patient_licencie');
  const orders=ADMIN_DATA.orders||[];
  const stats=ADMIN_DATA.eventStats||{consultations:0,abandoned:0,byAilment:{},abandonReasons:{}};
  // MRR — colonne réelle `pharmacies.plan` (verrouillée côté DB hors service_role)
  const planPrices={free:0,ref:49,prio:99,alt:199};
  const mrr=pharmacies.reduce((s,p)=>s+(planPrices[p.plan||'free']||0),0);
  // Plan breakdown
  const planBreak={free:0,ref:0,prio:0,alt:0};
  pharmacies.forEach(p=>{const pl=p.plan||'free';planBreak[pl]=(planBreak[pl]||0)+1;});
  // Orders this month
  const monthStart=new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const ordersMonth=orders.filter(o=>o.created_at&&new Date(o.created_at).getTime()>monthStart.getTime()).length;
  return {patients,pharmacies,drivers,orders,stats,mrr,planBreak,ordersMonth};
}

// ════════════════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════════════════
async function showPage(page){
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('on'));
  const map={dashboard:0,users:1,pharmacies:2,orders:3,promo:4,association:5,system:6};
  const items=document.querySelectorAll('.sb-item');
  if(items[map[page]]) items[map[page]].classList.add('on');
  const c=document.getElementById('mainContent');
  // Ces pages affichent des données réelles Supabase — on les recharge à
  // chaque navigation pour rester à jour (petit tableau de bord, faible
  // trafic admin attendu : pas besoin de cache plus élaboré).
  if(['dashboard','users','pharmacies','orders','system'].includes(page)){
    c.innerHTML='<div class="page-title">Chargement…</div>';
    await loadAdminData(true);
  }
  if(page==='dashboard'){
    ADMIN_DATA.eventStats=await loadAppEventsAdmin();
  }
  if(page==='pharmacies'){
    await loadPharmacyApplicationsAdmin();
  }
  if(['promo','system'].includes(page)){
    c.innerHTML='<div class="page-title">Chargement…</div>';
    await loadPromoCodesAdmin();
  }
  switch(page){
    case 'dashboard': c.innerHTML=pageDashboard(); break;
    case 'users': c.innerHTML=pageUsers(); break;
    case 'pharmacies': c.innerHTML=pagePharmacies(); break;
    case 'orders': c.innerHTML=pageOrders(); break;
    case 'promo': c.innerHTML=pagePromo(); initPromoEvents(); break;
    case 'association': c.innerHTML=pageAssociation(); break;
    case 'system': c.innerHTML=pageSystem(); break;
  }
  window.scrollTo({top:0});
}

// ════════════════════════════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════════════════════════════
function pageDashboard(){
  const {patients,pharmacies,drivers,orders,stats,mrr,planBreak,ordersMonth}=computeKPIs();
  const convRate=stats.consultations?Math.round(orders.length/stats.consultations*100):0;
  const planColors={free:'#888',ref:'#16A34A',prio:'#7C3AED',alt:'#C2F23E'};

function initPromoEvents(){}

async function generateCode(){
  const btn=document.querySelector('.gen-btn');
  const pfx=(document.getElementById('pfx').value.toUpperCase().replace(/[^A-Z0-9]/g,'')||'LIVRAI').slice(0,8);
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const _rb=new Uint8Array(6); crypto.getRandomValues(_rb);
  const rnd=Array.from(_rb,b=>chars[b%chars.length]).join('');
  const code=pfx+rnd;
  const type=document.getElementById('disc-type').value;
  const value=parseInt(document.getElementById('disc-val').value)||20;
  const target=document.getElementById('disc-target').value;
  const maxUses=parseInt(document.getElementById('disc-uses').value);
  const expDays=parseInt(document.getElementById('disc-exp').value);
  const row={
    code, type, value, target,
    max_uses:maxUses, active:true,
    expires_at:expDays?new Date(Date.now()+expDays*86400000).toISOString():null,
    created_by:adminUser?.id||null
  };
  if(btn){btn.disabled=true;btn.textContent='Création…';}
  const {data,error}=await createPromoCodeAdmin(row);
  if(btn){btn.disabled=false;btn.textContent='⚡ Générer le code';}
  if(error){
    document.getElementById('gen-result').innerHTML=`<span style="font-size:13px;color:var(--err);font-weight:600">Erreur : ${esc(error.code==='23505'?'ce code existe déjà.':error.message)}</span>`;
    return;
  }
  document.getElementById('gen-result').innerHTML=`
    <span class="code-tag">${esc(code)}</span>
    <button class="copy-btn" onclick="copyCode('${esc(code)}')">📋 Copier</button>
    <span style="font-size:13px;color:var(--ok);font-weight:600">✓ Créé</span>`;
  await loadPromoCodesAdmin();
  const tbody=document.getElementById('promo-table');
  if(tbody) tbody.innerHTML=renderPromoRows(ADMIN_DATA.promoCodes);
}

function renderPromoRows(codes){
  codes=codes||ADMIN_DATA.promoCodes||[];
  if(!codes.length) return '';
  const targetLabels={all:'Tous',patient:'Patients',pharmacie:'Pharmacies',livreur:'Livreurs'};
  const typeLabels={percent:v=>`-${v}%`,fixed:v=>`-€${v}`};
  return codes.map(c=>{
    const targetLabel=targetLabels[c.target]||c.target;
    const label=(typeLabels[c.type]||(v=>`-${v}`))(c.value);
    const expiresMs=c.expires_at?new Date(c.expires_at).getTime():null;
    const expired=expiresMs&&Date.now()>expiresMs;
    const status=!c.active?'Désactivé':expired?'Expiré':'Actif';
    const statusBadge={'Actif':'b-ok','Expiré':'b-err','Désactivé':'b-warn'}[status];
    const expLabel=c.expires_at?new Date(c.expires_at).toLocaleDateString('fr-FR'):'Jamais';
    return `<tr>
      <td><span class="code-tag" style="font-size:13px;letter-spacing:2px">${esc(c.code)}</span></td>
      <td style="font-weight:700">${esc(label)}</td>
      <td><span class="badge b-pharma">${esc(targetLabel)}</span></td>
      <td style="font-size:13px">${c.used_count||0}/${c.max_uses||'∞'}</td>
      <td style="font-size:12px;color:var(--mid)">${expLabel}</td>
      <td><span class="badge ${statusBadge}">${status}</span></td>
      <td style="display:flex;gap:6px">
        <button class="copy-btn" onclick="copyCode('${esc(c.code)}')">📋</button>
        <button class="copy-btn" style="color:var(--err);border-color:var(--err)" onclick="toggleCode('${esc(c.code)}',${!c.active})">
          ${c.active?'⏸':'▶'}
        </button>
        <button class="copy-btn" style="color:var(--err);border-color:var(--err)" onclick="deleteCode('${esc(c.code)}')">🗑</button>
      </td>
    </tr>`;}).join('');
}

function copyCode(code){
  navigator.clipboard.writeText(code).then(()=>{
    // Visual feedback
    const btns=[...document.querySelectorAll('.copy-btn')].filter(b=>b.textContent.includes('📋'));
    btns.forEach(b=>{ if(b.closest('tr')?.textContent.includes(code)){b.textContent='✓';setTimeout(()=>b.textContent='📋',1500);}});
  }).catch(()=>alert('Code: '+code));
}

async function toggleCode(code,active){
  const {error}=await togglePromoCodeAdmin(code,active);
  if(error){alert('Erreur : '+error.message);return;}
  await loadPromoCodesAdmin();
  const tbody=document.getElementById('promo-table');
  if(tbody) tbody.innerHTML=renderPromoRows(ADMIN_DATA.promoCodes);
}

async function deleteCode(code){
  if(!confirm('Supprimer ce code ?')) return;
  const {error}=await deletePromoCodeAdmin(code);
  if(error){alert('Erreur : '+error.message);return;}
  await loadPromoCodesAdmin();
  const tbody=document.getElementById('promo-table');
  if(tbody) tbody.innerHTML=renderPromoRows(ADMIN_DATA.promoCodes);
}

  {id:'cardio',name:'Fédération Française de Cardiologie',icon:'❤️‍🩹',url:'https://www.fedecardio.org'},
  {id:'arc',name:'Fondation ARC',icon:'🔬',url:'https://www.fondation-arc.org'},
  {id:'aides',name:'Aides',icon:'🌈',url:'https://www.aides.org'},
];
function pageAssociation(){
  const month=new Date().getMonth();
  const current=HEALTH_ASSOCS[month%HEALTH_ASSOCS.length];
  const override=localStorage.getItem('livr_assoc_override');
  const displayed=override?HEALTH_ASSOCS.find(a=>a.id===override)||current:current;
  return `
  <div class="page-title">🎗️ Association du mois</div>
  <div class="card">
    <h3>Association actuellement affichée dans l'app</h3>
    <div class="assoc-month">
      <div class="icon">${displayed.icon}</div>
      <div>
        <div style="font-weight:800;font-size:18px;margin-bottom:4px">${displayed.name}</div>
        <a href="${displayed.url}" target="_blank" style="color:var(--pharma);font-size:13px">${displayed.url}</a>
        ${override?'<div style="font-size:12px;color:var(--warn);margin-top:4px;font-weight:700">⚠ Override manuel actif</div>':'<div style="font-size:12px;color:var(--ok);margin-top:4px">✓ Rotation automatique (mois '+new Date().toLocaleDateString('fr-FR',{month:'long'})+')</div>'}
      </div>
    </div>
  </div>
  <div class="card">
    <h3>Calendrier annuel des rotations</h3>
    <table class="table">
      <thead><tr><th>Mois</th><th>Association</th><th></th></tr></thead>
      <tbody>
        ${HEALTH_ASSOCS.map((a,i)=>{
          const m=new Date(2026,i,1).toLocaleDateString('fr-FR',{month:'long'});
          const isCurrent=i===month%10;
          return `<tr style="${isCurrent?'background:#f0faf2':''}">
            <td style="font-weight:${isCurrent?'800':'400'}">${m.charAt(0).toUpperCase()+m.slice(1)}</td>
            <td>${a.icon} ${a.name}</td>
            <td><button onclick="overrideAssoc('${a.id}')" style="font-size:11px;font-weight:700;padding:4px 10px;border:1.5px solid var(--ink);border-radius:6px;background:transparent;cursor:pointer;font-family:inherit">Forcer</button></td>
          </tr>`;}).join('')}
      </tbody>
    </table>
    ${override?`<button onclick="clearOverride()" style="margin-top:12px;font-family:inherit;font-weight:700;font-size:13px;padding:10px 20px;border:1.5px solid var(--err);color:var(--err);border-radius:10px;background:transparent;cursor:pointer">Supprimer l'override — revenir au calendrier automatique</button>`:''}
  </div>`;
}
function overrideAssoc(id){localStorage.setItem('livr_assoc_override',id);showPage('association');}
function clearOverride(){localStorage.removeItem('livr_assoc_override');showPage('association');}

// ════════════════════════════════════════════════════════════
// SYSTÈME
// ════════════════════════════════════════════════════════════
function pageSystem(){
  const lsSize=new Blob(Object.values(localStorage)).size;
  const kb=(lsSize/1024).toFixed(1);
  const keys=Object.keys(localStorage).filter(k=>k.startsWith('livraisante'));
  return `
  <div class="page-title">⚙️ Système</div>
  <div class="grid2">
    <div class="card">
      <h3>État de la base de données</h3>
      <table class="table">
        <tbody>
          <tr><td>Storage utilisé (ce navigateur)</td><td style="font-weight:700">${kb} Ko</td></tr>
          <tr><td>Clés Livraisanté (local)</td><td style="font-weight:700">${keys.length}</td></tr>
          <tr><td>Comptes (Supabase)</td><td style="font-weight:700">${(ADMIN_DATA.profiles||[]).length}</td></tr>
          <tr><td>Pharmacies (Supabase)</td><td style="font-weight:700">${(ADMIN_DATA.pharmacies||[]).length}</td></tr>
          <tr><td>Livreurs (Supabase)</td><td style="font-weight:700">${(ADMIN_DATA.drivers||[]).length}</td></tr>
          <tr><td>Commandes (Supabase)</td><td style="font-weight:700">${(ADMIN_DATA.orders||[]).length}</td></tr>
          <tr><td>Codes promo (Supabase)</td><td style="font-weight:700">${(ADMIN_DATA.promoCodes||[]).length}</td></tr>
        </tbody>
      </table>
    </div>
    <div class="card">
      <h3>Informations app</h3>
      <table class="table">
        <tbody>
          <tr><td>Version SW</td><td style="font-weight:700;font-family:monospace">livraisante-v26</td></tr>
          <tr><td>Hébergement</td><td style="font-weight:700">GitHub Pages</td></tr>
          <tr><td>URL production</td><td style="font-size:11px"><a href="https://rayansaidomar1-arch.github.io/livraisante/" target="_blank" style="color:var(--pharma)">livraisante.github.io</a></td></tr>
          <tr><td>Type</td><td style="font-weight:700">PWA (Progressive Web App)</td></tr>
          <tr><td>Dernière MAJ</td><td style="font-weight:700">${new Date().toLocaleDateString('fr-FR')}</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="card">
    <h3>Actions système</h3>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <button onclick="exportData()" style="font-family:inherit;font-weight:700;font-size:13px;padding:10px 18px;border:2px solid var(--ink);border-radius:10px;background:var(--ink);color:var(--white);cursor:pointer">📥 Exporter les données (JSON)</button>
      <button onclick="if(confirm('Réinitialiser toutes les statistiques ?')){localStorage.removeItem('livraisante_stats_v2');showPage('system')}" style="font-family:inherit;font-weight:700;font-size:13px;padding:10px 18px;border:2px solid var(--warn);border-radius:10px;background:transparent;color:var(--warn);cursor:pointer">🔄 Reset statistiques</button>
      <button onclick="if(confirm('⚠ Supprimer toutes les données de démo ?')){['livraisante_accounts_v2','livraisante_orders_v2','livraisante_stats_v2'].forEach(k=>localStorage.removeItem(k));showPage('system')}" style="font-family:inherit;font-weight:700;font-size:13px;padding:10px 18px;border:2px solid var(--err);border-radius:10px;background:transparent;color:var(--err);cursor:pointer">🗑️ Purger les données démo</button>
    </div>
    <div style="font-size:12px;color:var(--mid);margin-top:12px">⚠ En production, ces actions seraient protégées et loggées. Actuellement en mode localStorage (prototype).</div>
  </div>`;
}

function exportData(){
  const data={
    exportedAt:new Date().toISOString(),
    profiles:ADMIN_DATA.profiles||[],
    pharmacies:ADMIN_DATA.pharmacies||[],
    drivers:ADMIN_DATA.drivers||[],
    orders:ADMIN_DATA.orders||[],
    stats:getStats(),
    eventStats:ADMIN_DATA.eventStats||null,
    promoCodes:ADMIN_DATA.promoCodes||[],
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`livraisante-export-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
}
</script>
</body>
</html>
